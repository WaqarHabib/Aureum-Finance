<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f3ec" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('billflow.theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#0c1322');
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <title>BillFlow · Calendar Cash Flow</title>
    <meta name="description" content="BillFlow is a calendar-based cash flow planner. See upcoming bills, income, and projected balance on a monthly calendar." />
    <meta name="author" content="BillFlow" />
    <meta property="og:title" content="BillFlow · Calendar Cash Flow" />
    <meta property="og:description" content="Plan your bills, income, and future balance on a clear monthly calendar." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BillFlow" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="msapplication-TileColor" content="#0F2742" />
    <meta name="msapplication-TileImage" content="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
